server:
  port: 8084

spring:
  application:
    name: message-broker-be
  datasource:
    url: jdbc:postgresql://localhost:5432/broker_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: mongodb://root:rootpassword@localhost:27017/micro_db?authSource=admin
  mail:
    host: mailhog
    port: 1025
    username: user
    password: password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
